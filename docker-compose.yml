services:
  postgres:
    image: postgres:16-alpine
    container_name: moonverse-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: moonverse
      POSTGRES_PASSWORD: moonverse
      POSTGRES_DB: moonverse
    volumes:
      - moonverse_postgres_data:/var/lib/postgresql/data

volumes:
  moonverse_postgres_data: